gazebo_ros2_control:
  ros__parameters:
    hold_joints: true

controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["fl_wheel_joint", "hl_wheel_joint"]
    right_wheel_names: ["fr_wheel_joint", "hr_wheel_joint"]
    wheel_separation: 0.137
    wheels_per_side: 2
    wheel_radius: 0.05
    left_wheel_radius: 0.05
    right_wheel_radius: 0.05
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    velocity_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    use_stamped_vel: false

