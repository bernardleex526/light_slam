# M20 真机配置（云深处 M20 Pro / RK3588 / ROS2 Foxy）
# 基于 default_robosense.yaml，针对真机部署调整：
#   - 关闭 UI（真机无显示器/不抢资源）
#   - use_sim_time: false（真机用墙钟）
#   - sensor_best_effort: true（雷达驱动常为 best_effort）
#   - scan_line: 96（M20 用 96 线 RoboSense RSAIRY）
#   - 话题名对齐 M20 官方：/LIDAR/POINTS, /IMU, /odom_wheel
#
# 参考：D:\m20pro\mechanical_dog_control_demo\doc 算法工程师实战手册

common:
  dataset: "robosense"
  lidar_topic: "/LIDAR/POINTS"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/IMU"
  odom_topic: "/odom_wheel"

# fasterlio 参数
fasterlio:
  lidar_type: 4                # 4 for robosense
  scan_line: 96                # M20 用 96 线 RoboSense RSAIRY（手册 §10.1）
  blind: 0.5                   # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 仅对 Velodyne(lidar_type=2)生效

  skip_lidar_num: 0
  point_filter_num: 6          # 96 线点云密度大，采样参数可适当调大
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1

  use_aa: false

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  # IMU-LiDAR 外参：M20 前雷达 x=0.32028, z=-0.013（手册 §10.1）
  # 但驱动已将点云变换到 base_link，故外参取 identity 即可
  extrinsic_T: [ 0, 0, 0 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]

  keep_first_imu_estimation: false
  kf_dis_th: 1.0
  kf_angle_th: 2.0

  enable_icp_part: true
  kalman_R: 0.1
  min_pts: 300
  imu_filter: true
  # 必需键（无默认值，缺失即 init 崩溃 "bad conversion"；2026-08-12 W1 真机数据验证修复）
  plane_icp_weight: 500.0
  proj_kfs: false

  # 轮速融合参数（leg_wheel_odom 发布 /odom_wheel）
  wheel_odom_weight: 1.0
  wheel_degeneracy_boost: 4.0
  degeneracy_threshold_ratio: 0.001
  degeneracy_cov_inflation: 1.02

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.2

system:
  with_loop_closing: true
  with_ui: false              # 真机无显示器，关闭 3D UI（Pangolin）
  with_2dui: false            # 真机关闭 2D UI（OpenCV imshow）
  with_g2p5: true
  step_on_kf: false

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 0
  map_path: /var/opt/robot/data/maps/active/   # 对齐 M20 drmap 激活地图路径
  pub_tf: true
  # 定位输出话题（对接原厂导航：原厂 planner 订阅 /ODOM）。
  # 需要与原厂定位链并行隔离验收时改为 /m20_slam/odom（不接管 /ODOM）。
  odom_topic: /ODOM
  # 建图 LIO 位姿输出话题（/lio_pose）。
  # 隔离模式可改为 /m20_slam/pose。
  lio_pose_topic: /lio_pose

  use_sim_time: false         # 真机用墙钟时间
  sensor_best_effort: true    # 雷达驱动常为 best_effort QoS

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 90.0
  grid_search_angle_step: 10
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 0.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 10.0
  height_min: -10.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 0.82            # M20 车身长（手册 §10.4 L_body=0.82m）
  car_width: 0.506            # M20 车身宽（手册 §10.4 W_body=0.506m）
  car_height: 1.7
  scans: 1